<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Arcilla 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#17171a;--ui:#232326;--btn:#2e2e32;--ac:#8e8e93;--acx:#141416;--tx:#e8e8ea;--mut:#9a9aa0;--r:3px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:12px system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
*{outline:0!important;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
body[data-mode="sculpt"] [data-m="poly"],body[data-mode="poly"] [data-m="sculpt"]{display:none!important}
body.cl #ui,body.cl #sl{display:none}
.psel{display:contents}
body[data-mode="poly"]:not([data-pb="1"]) #brushes{display:none!important}
body[data-pb="1"] .psel,body[data-pb="2"] .psel{display:none!important}
body[data-mode="poly"] #brushes [data-b="paint"]{display:none}
button,select{font:inherit;color:var(--tx);background:transparent;border:0;border-radius:var(--r);padding:0}
button{display:flex;align-items:center;justify-content:center;position:relative}
button::after{content:"";position:absolute;inset:-2px}
button.on{background:var(--ac);color:var(--acx)}
svg.i{width:28px;height:28px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{stroke:none}svg.i .s{fill:none}
button span{display:none}.ax span{display:inline;font-size:14px}
.grp,#ui,#sl,#np{background:var(--ui);border-radius:var(--r)}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.grp{display:flex;align-items:center}
.grp button{width:48px;height:44px;flex:none}
.grp button.tx{width:auto;padding:0 16px;font-size:14px}
.cw{width:48px;height:44px;display:flex;align-items:center;justify-content:center}
input[type=color]{width:26px;height:26px;border:0;border-radius:50%;padding:0;background:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
#ui{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;max-width:calc(100% - 16px);display:flex;overflow-x:auto;scrollbar-width:none;z-index:3}
#ui::-webkit-scrollbar{display:none}
#ui .row{display:flex;align-items:center;flex:none}
#ui button{width:52px;height:52px;flex:none}
#ui .ax{width:auto;min-width:44px;padding:0 8px}
.sep{width:1px;height:28px;background:#3b3b40;margin:0 6px;flex:none}
#sl{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3;background:none}
.vs{width:36px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;background:var(--ui);border-radius:var(--r)}
.vt{position:relative;width:36px;height:130px}
.vt input{position:absolute;left:50%;top:50%;width:130px;height:36px;margin:0;transform:translate(-50%,-50%) rotate(-90deg)}
.vs span{font-size:10px;color:var(--mut);margin-top:4px}
input[type=range]{padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#3b3b40;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-2.5px;border-radius:50%;background:var(--ac);border:0;box-shadow:none}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#3b3b40;border:0}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ac);border:0}
#np{position:absolute;top:62px;right:112px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:4}#np.open{display:flex}
select{height:40px;background:var(--btn);padding:0 12px;appearance:none;-webkit-appearance:none;font-size:14px}
#np button{height:40px;background:var(--btn);padding:0 14px;font-size:14px}
#msg{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:var(--ui);padding:7px 14px;border-radius:var(--r);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;font-size:13px;z-index:5}
#box{position:fixed;display:none;background:rgba(255,255,255,.14);border-radius:2px;pointer-events:none;z-index:4}
#shf{position:absolute;right:14px;top:46%;width:56px;height:56px;padding:0;border-radius:50%;background:transparent;border:1.5px solid var(--mut);color:var(--mut);opacity:.85;touch-action:none;z-index:5;-webkit-touch-callout:none}
#shf::after{display:none}
#shf.on{background:rgba(255,255,255,.16);border-color:var(--tx);color:var(--tx);opacity:1}
#shf.on path{fill:currentColor}
#cp{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:none;background:var(--ui);border-radius:var(--r);z-index:4}
body[data-pc="1"] #cp{display:flex}
#cp button{height:38px;padding:0 14px;font-size:14px}
#op,#bp{position:absolute;top:62px;right:112px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:4;background:var(--ui);border-radius:var(--r);min-width:190px}
#op.open,#bp.open{display:flex}
#ol{display:flex;flex-direction:column;gap:4px}
.or{display:flex;gap:4px}
.or button,#bp button{height:38px;background:var(--btn);padding:0 12px;font-size:14px}
.or button{flex:1}.or .od{flex:none;width:38px;padding:0}
.or select{flex:1;height:38px}
#op button.on,#bp button.on{background:var(--ac);color:var(--acx)}
.hint{font-size:11px;color:var(--mut)}
#bp{min-width:230px}
.bl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
.bl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ca{background:#9cc3ff}.cb{background:#ff9c9c}
#bp button{flex-direction:column;gap:1px}
#bp button b{font-size:14px;font-weight:500}
#bp small{font-size:10px;color:var(--mut)}
#bp #bk{height:34px;font-size:13px}
#bp button.on small{color:var(--acx)}
#sc{position:absolute;top:62px;right:112px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:4;background:var(--ui);border-radius:var(--r);min-width:210px}
#sc.open{display:flex}
#sg-s,#sg-r{display:flex;flex-direction:column;gap:6px}
#sc:not([data-sm="r"]) #sg-r,#sc[data-sm="r"] #sg-s{display:none}
.sl .v{width:42px;text-align:right;font-size:12px;color:var(--mut)}
.sl{display:flex;align-items:center;gap:8px;color:var(--mut)}
.sl b{width:14px;font-weight:500;color:var(--tx);font-size:13px}
#sc input{flex:1;height:30px;margin:0}
#sc button{height:34px;background:var(--btn);padding:0 12px;font-size:13px}
#sc button.on{background:var(--ac);color:var(--acx)}
#tp{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:4px;background:var(--ui);border-radius:var(--r);padding:4px;z-index:4}
body[data-tr="1"] #tp{display:flex}
#tp button{height:38px;padding:0 12px;font-size:14px;background:var(--btn)}
#tp button.on{background:var(--ac);color:var(--acx)}
#gzw{position:absolute;top:62px;right:8px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
#gz{width:96px;height:96px;touch-action:none}
#vtog{height:30px;padding:0 14px;font-size:12px;background:var(--ui);color:var(--tx)}
</style></head><body data-mode="sculpt">
<div id="app"><canvas id="cv"></canvas><div id="msg"></div><div id="box"></div><button id="shf" title="Modificador (toque: fijar, mantener: temporal)"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path class="s" d="M12 5l8 14H4z"/></svg></button>
<div id="top">
<div class="grp"><button id="mS" class="tx on">Moldear</button><button id="mP" class="tx">Poly</button></div>
<div class="grp"><button id="sub" title="Quitar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M5 12h14"/></svg></button><button id="sym" class="on" title="Simetría"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M11 2h2v3h-2zm0 5h2v3h-2zm0 5h2v3h-2zm0 5h2v3h-2zM3 8h6v8H3zm12 0h6v8h-6z"/></svg></button><label class="cw" title="Color"><input id="clr" type="color" value="#c7634a"></label><button id="ptot" title="Pintar todo"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path class="f" d="M8 8h8v8H8z"/></svg></button><button id="pscale" title="Escalar y rotar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M5 19l6-6M5 19v-5M5 19h5M19 5l-6 6M19 5v5M19 5h-5"/></svg></button><button id="ptr" title="Transformar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 8h8v12H4z"/><path class="s" d="M13 11l7-7M14 4h6v6"/></svg></button><button id="pmesh" class="on" data-m="poly" title="Mostrar u ocultar malla"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke-width="1.6"/><path class="s" d="M12 3v18M4 7.5l16 9M20 7.5l-16 9" stroke-width="1.6"/></svg></button><button id="pobj" data-m="poly" title="Objetos"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 9h11v11H4z" stroke-width="1.7"/><path class="s" d="M9 4h11v11H9z" stroke-width="1.7"/></svg></button><button id="pbool" data-m="poly" title="Booleano"><svg class="i" viewBox="0 0 24 24"><circle class="s" cx="9" cy="12" r="6" stroke-width="1.7"/><circle class="s" cx="15" cy="12" r="6" stroke-width="1.7"/></svg></button></div>
<div class="grp" style="margin-left:auto"><button id="undo" title="Deshacer"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 4v6h6M5.6 14a8 8 0 101.9-8.4L4 10"/></svg></button><button id="exp" title="Exportar GLB"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button><button id="nw" title="Nuevo"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M12 5v14M5 12h14"/></svg></button><button id="hide" title="Ocultar menú"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 9l6 6 6-6"/></svg></button></div>
</div>
<div id="np"><select id="shape"><option value="sphere">Esfera</option><option value="cube">Cubo</option><option value="slab">Lámina</option><option value="cyl">Cilindro</option><option value="plane">Plano</option></select><select id="res" data-m="sculpt"><option value="5000">Resolución baja</option><option value="12000" selected>Resolución media</option></select><button id="new">Crear</button></div>
<div id="op" data-m="poly"><div id="ol"></div><div class="or"><select id="oshape"><option value="sphere">Esfera</option><option value="cube">Cubo</option><option value="slab">Lámina</option><option value="cyl">Cilindro</option><option value="plane">Plano</option></select><button id="oadd" class="od">+</button></div></div>

<label class="bl"><i class="ca"></i>A · el que se modifica<select id="ba"></select></label>
<label class="bl"><i class="cb"></i>B · la herramienta<select id="bt"></select></label>
<button id="bu"><b>Unión</b><small>A y B en un solo objeto</small></button>

<button id="bk">Conservar B</button></div>
<div id="sc"><div class="or"><button id="scm-s" class="on">Escalar</button><button id="scm-r">Rotar</button></div>
<div id="sg-s"><span class="hint">Escala la selección o, sin selección, todo el objeto.</span><button id="scu" class="on">Uniforme</button><label class="sl"><b>X</b><input id="sx" type="range" min="20" max="300" value="100"><span class="v" id="sxv">100%</span></label><label class="sl"><b>Y</b><input id="sy" type="range" min="20" max="300" value="100"><span class="v" id="syv">100%</span></label><label class="sl"><b>Z</b><input id="sz" type="range" min="20" max="300" value="100"><span class="v" id="szv">100%</span></label></div>
<div id="sg-r"><span class="hint">Rota la selección o, sin selección, todo el objeto.</span><label class="sl"><b>X</b><input id="rx" type="range" min="-180" max="180" value="0"><span class="v" id="rxv">0°</span></label><label class="sl"><b>Y</b><input id="ry" type="range" min="-180" max="180" value="0"><span class="v" id="ryv">0°</span></label><label class="sl"><b>Z</b><input id="rz" type="range" min="-180" max="180" value="0"><span class="v" id="rzv">0°</span></label></div>
<button id="sca">Anclar a la base</button></div>
<div id="tp"><button id="tm-m" class="on">Mover</button><button id="tm-s">Estirar</button><span class="sep"></span><button id="tx-l" class="on">Libre</button><button id="tx-x">X</button><button id="tx-y">Y</button><button id="tx-z">Z</button><span class="sep"></span><button id="tvol" class="on">Volumen</button></div>
<div id="sl"><div class="vs"><div class="vt"><input id="rad" type="range" min="1" max="100" value="35"></div><span>Tam</span></div><div class="vs"><div class="vt"><input id="str" type="range" min="1" max="300" value="40"></div><span>Fza</span></div></div>

<svg id="cutsvg" style="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none;z-index:4"><line id="cutln" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 4"/></svg>

.8 2.8 7.9-7.9a2 2 0 000-2.8z"/><path class="f" d="M9 12.5c-2 0-3.5 1.5-3.5 3.5 0 1.2-.6 2.2-1.6 3 1 .5 2.1.7 3.2.7 2.6 0 4.4-1.6 4.4-3.9z"/></svg></button></div><div class="row" data-m="poly"><span class="psel"><button id="pm-v" class="on" title="Vértice"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="5"/></svg></button><button id="pm-e" title="Borde"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 18L18 6"/><circle class="f" cx="6" cy="18" r="3"/><circle class="f" cx="18" cy="6" r="3"/></svg></button><button id="pm-f" title="Cara"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M5 5h14v14H5z"/></svg></button><button id="psa" title="Seleccionar todo"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M5 5h14v14H5z" stroke-dasharray="3 2.5" stroke-width="1.6"/><circle class="f" cx="5" cy="5" r="2"/><circle class="f" cx="19" cy="5" r="2"/><circle class="f" cx="5" cy="19" r="2"/><circle class="f" cx="19" cy="19" r="2"/></svg></button><span class="sep"></span><button class="ax on" id="ax-l" title="Eje libre"><svg class="i" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="9"/><ellipse class="s" cx="12" cy="12" rx="9" ry="3.5"/><ellipse class="s" cx="12" cy="12" rx="3.5" ry="9"/></svg></button><button class="ax" id="ax-x" title="Eje"><span>X</span></button><button class="ax" id="ax-y" title="Eje"><span>Y</span></button><button class="ax" id="ax-z" title="Eje"><span>Z</span></button><span class="sep"></span><button id="ext" title="Extruir"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M6 13h12v7H6z"/><path class="f" d="M12 3l5 5h-3.5v4h-3V8H7z"/></svg></button><button id="sbd" title="Subdividir"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 4h16v16H4zM12 4v16M4 12h16"/></svg></button><button id="del" title="Borrar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 6l12 12M18 6L6 18"/></svg></button><button id="ppaint" title="Pintar caras"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M4 13l7-7 8 8-7 7z"/><path class="f" d="M20 15c1 1.5 1.5 2.5 1.5 3.3a1.5 1.5 0 01-3 0c0-.8.5-1.8 1.5-3.3z"/></svg></button><button id="hole" title="Rellenar agujero"><svg class="i" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle class="f" cx="12" cy="12" r="4"/></svg></button><button id="pcut" title="Cortar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M5 7h14v12H5z"/><path class="s" d="M3 21L21 3"/></svg></button></span><button id="pbr" title="Pinceles"><svg class="i" viewBox="0 0 24 24"><path class="f" fill-rule="evenodd" d="M6 2h12v6H6zM8.6 3.6v3.2h.9V3.6zM11.5 4.2v2.6h.9V4.2zM14.4 3.6v3.2h.9V3.6z"/><path class="f" d="M6 9h12v3.2H6z"/><path class="f" fill-rule="evenodd" d="M9.2 12.8h5.6l-.9 7.7a2 2 0 01-3.8 0zM12 18.3m-.8 0a.8.8 0 101.6 0 .8.8 0 10-1.6 0z"/></svg></button><button id="pnt" title="Pintar"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M20.7 3.3a2 2 0 00-2.8 0L10 11.2l2.8 2.8 7.9-7.9a2 2 0 000-2.8z"/><path class="f" d="M9 12.5c-2 0-3.5 1.5-3.5 3.5 0 1.2-.6 2.2-1.6 3 1 .5 2.1.7 3.2.7 2.6 0 4.4-1.6 4.4-3.9z"/></svg></button><span class="psel"><button id="toscu" title="A moldear"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="8"/></svg></button></span></div></div></div>

let triCount=0,topoVer=0,idxCache=null;const DYN={L:.06,max:150000,warned:false};

const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),pointers=new Set();

const R=()=>.03+Math.pow($('rad').value/100,2)*2.4,K=()=>$('str').value/100;
let pDir=null,pLast=null;

function regionN(p,Rr){
  const g=region(p,Rr);let a=0,b=0,c=0;

function ringShow(x,y,pt){

function endS(){if(S&&S.prev)brush=S.prev;S=null;ringHide()}
function panBy(e){

document.querySelectorAll('.brush').forEach(b=>b.onclick=()=>{document.querySelectorAll('.brush').forEach(x=>x.classList.remove('on'));b.classList.add('on');brush=b.dataset.b});
$('sub').onclick=e=>{sub=!sub;e.currentTarget.classList.toggle('on',sub)};
$('sym').onclick=e=>{sym=!sym;e.currentTarget.classList.toggle('on',sym)};

$('exp').onclick=()=>{
  new THREE.GLTFExporter().parse(mode==='poly'?polyExport():sculptExport(),async buf=>{
    try{const d=window.claude&&await claude.use('downloads');

};

const FOV=45,OFOV=6,T=controls.target,tn=f=>Math.tan(f*Math.PI/360);
let ortho=false,snapDir=null,anim=null;
const V=(x,y,z)=>new THREE.Vector3(x,y,z).normalize();
