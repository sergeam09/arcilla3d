<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Arcilla 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#17171a;--ui:#232326;--btn:#2e2e32;--ac:#8e8e93;--acx:#141416;--tx:#e8e8ea;--mut:#9a9aa0;--r:3px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:12px system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
*{outline:0!important;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
body[data-mode="sculpt"] [data-m="poly"],body[data-mode="poly"] [data-m="sculpt"]{display:none!important}
body.cl #ui,body.cl #sl{display:none}
button,select{font:inherit;color:var(--tx);background:transparent;border:0;border-radius:var(--r);padding:0}
button{display:flex;align-items:center;justify-content:center;position:relative}
button::after{content:"";position:absolute;inset:-2px}
button.on{background:var(--ac);color:var(--acx)}
svg.i{width:28px;height:28px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{stroke:none}svg.i .s{fill:none}
button span{display:none}.ax span{display:inline;font-size:14px}
.grp,#ui,#sl,#np{background:var(--ui);border-radius:var(--r)}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.grp{display:flex;align-items:center}
.grp button{width:48px;height:44px;flex:none}
.grp button.tx{width:auto;padding:0 16px;font-size:14px}
.cw{width:48px;height:44px;display:flex;align-items:center;justify-content:center}
input[type=color]{width:26px;height:26px;border:0;border-radius:50%;padding:0;background:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
#ui{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;max-width:calc(100% - 16px);display:flex;overflow-x:auto;scrollbar-width:none;z-index:3}
#ui::-webkit-scrollbar{display:none}
#ui .row{display:flex;align-items:center;flex:none}
#ui button{width:52px;height:52px;flex:none}
#ui .ax{width:auto;min-width:44px;padding:0 8px}
.sep{width:1px;height:28px;background:#3b3b40;margin:0 6px;flex:none}
#sl{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3;background:none}
.vs{width:36px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;background:var(--ui);border-radius:var(--r)}
.vt{position:relative;width:36px;height:130px}
.vt input{position:absolute;left:50%;top:50%;width:130px;height:36px;margin:0;transform:translate(-50%,-50%) rotate(-90deg)}
.vs span{font-size:10px;color:var(--mut);margin-top:4px}
input[type=range]{padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#3b3b40;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7.5px;border-radius:50%;background:var(--ac);border:0;box-shadow:none}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#3b3b40;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ac);border:0}
#np{position:absolute;top:62px;right:112px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:4}#np.open{display:flex}
select{height:40px;background:var(--btn);padding:0 12px;appearance:none;-webkit-appearance:none;font-size:14px}
#np button{height:40px;background:var(--btn);padding:0 14px;font-size:14px}
#msg{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:var(--ui);padding:7px 14px;border-radius:var(--r);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;font-size:13px;z-index:5}
#box{position:fixed;display:none;background:rgba(255,255,255,.14);border-radius:2px;pointer-events:none;z-index:4}
#shf{position:absolute;right:14px;top:46%;width:56px;height:56px;padding:0;border-radius:50%;background:transparent;border:1.5px solid var(--mut);color:var(--mut);opacity:.85;touch-action:none;z-index:5;-webkit-touch-callout:none}
#shf::after{display:none}
#shf.on{background:rgba(255,255,255,.16);border-color:var(--tx);color:var(--tx);opacity:1}
#shf.on path{fill:currentColor}
#gzw{position:absolute;top:62px;right:8px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
#gz{width:96px;height:96px;touch-action:none}
#vtog{height:30px;padding:0 14px;font-size:12px;background:var(--ui);color:var(--tx)}
</style></head><body data-mode="sculpt">
<div id="app"><canvas id="cv"></canvas><div id="msg"></div><div id="box"></div><button id="shf" title="Modificador (toque: fijar, mantener: temporal)"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path class="s" d="M12 5l8 14H4z"/></svg></button>
<div id="top">
<div class="grp"><button id="mS" class="tx on">Escultura</button><button id="mP" class="tx">Poly</button></div>
<div class="grp"><button id="sub" title="Quitar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M5 12h14"/></svg></button><button id="sym" class="on" title="Simetría"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M11 2h2v3h-2zm0 5h2v3h-2zm0 5h2v3h-2zm0 5h2v3h-2zM3 8h6v8H3zm12 0h6v8h-6z"/></svg></button><label class="cw" title="Color"><input id="clr" type="color" value="#c7634a"></label></div>
<div class="grp" style="margin-left:auto"><button id="undo" title="Deshacer"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 4v6h6M5.6 14a8 8 0 101.9-8.4L4 10"/></svg></button><button id="exp" title="Exportar GLB"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button><button id="nw" title="Nuevo"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M12 5v14M5 12h14"/></svg></button><button id="hide" title="Ocultar menú"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 9l6 6 6-6"/></svg></button></div>
</div>
<div id="np"><select id="shape"><option value="sphere">Esfera</option><option value="cube">Cubo</option><option value="slab">Lámina</option><option value="cyl">Cilindro</option><option value="plane">Plano</option></select><select id="res" data-m="sculpt"><option value="5000">Resolución baja</option><option value="12000" selected>Resolución media</option></select><button id="new">Crear</button></div>
<div id="sl"><div class="vs"><div class="vt"><input id="rad" type="range" min="1" max="100" value="35"></div><span>Tam</span></div><div class="vs"><div class="vt"><input id="str" type="range" min="1" max="100" value="40"></div><span>Fza</span></div></div>
<div id="gzw"><canvas id="gz"></canvas><button id="vtog">Perspectiva</button></div>
<div id="ui"><div class="row" data-m="sculpt" id="brushes"><button data-b="push" class="brush on" title="Empujar"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M11 3h2v9h3l-4 5-4-5h3z"/><path class="f" d="M5 19h14v2H5z"/></svg></button><button data-b="inflate" class="brush" title="Inflar"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="12" cy="10" r="7"/><path class="f" d="M10 18h4l-1 3h-2z"/></svg></button><button data-b="smooth" class="brush" title="Suavizar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M3 12c3-5 6-5 9 0s6 5 9 0"/></svg></button><button data-b="grab" class="brush" title="Agarrar"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M12 2l4 4h-3v5h5V8l4 4-4 4v-3h-5v5h3l-4 4-4-4h3v-5H6v3l-4-4 4-4v3h5V6H8z"/></svg></button><button data-b="pinch" class="brush" title="Pellizcar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 6l6 6-6 6M20 6l-6 6 6 6"/></svg></button><button data-b="paint" class="brush" title="Pintar"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M12 2.5c3.5 4.2 6 7.2 6 10.5a6 6 0 01-12 0c0-3.3 2.5-6.3 6-10.5z"/></svg></button></div><div class="row" data-m="poly"><button id="pm-v" class="on" title="Vértice"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="5"/></svg></button><button id="pm-e" title="Borde"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 18L18 6"/><circle class="f" cx="6" cy="18" r="3"/><circle class="f" cx="18" cy="6" r="3"/></svg></button><button id="pm-f" title="Cara"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M5 5h14v14H5z"/></svg></button><span class="sep"></span><button class="ax on" id="ax-l" title="Eje libre"><svg class="i" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="9"/><ellipse class="s" cx="12" cy="12" rx="9" ry="3.5"/><ellipse class="s" cx="12" cy="12" rx="3.5" ry="9"/></svg></button><button class="ax" id="ax-x" title="Eje"><span>X</span></button><button class="ax" id="ax-y" title="Eje"><span>Y</span></button><button class="ax" id="ax-z" title="Eje"><span>Z</span></button><span class="sep"></span><button id="ext" title="Extruir"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M6 13h12v7H6z"/><path class="f" d="M12 3l5 5h-3.5v4h-3V8H7z"/></svg></button><button id="sbd" title="Subdividir"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M4 4h16v16H4zM12 4v16M4 12h16"/></svg></button><button id="del" title="Borrar"><svg class="i" viewBox="0 0 24 24"><path class="s" d="M6 6l12 12M18 6L6 18"/></svg></button><button id="ppaint" title="Rellenar"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M12 2.5c3.5 4.2 6 7.2 6 10.5a6 6 0 01-12 0c0-3.3 2.5-6.3 6-10.5z"/></svg></button><button id="pbr" title="Pincel"><svg class="i" viewBox="0 0 24 24"><path class="f" d="M3 21l1-5L16 4l4 4L8 20z"/></svg></button><button id="toscu" title="A escultura"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="8"/></svg></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.05,200);
camera.position.set(0,.3,3.4);scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,.9));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(2,3,4);camera.add(dl);
const controls=new THREE.TrackballControls(camera,cv);controls.rotateSpeed=3;controls.zoomSpeed=1.2;controls.panSpeed=.8;controls.staticMoving=true;controls.minDistance=.4;controls.maxDistance=150;
let mesh,geo,pos,col,nrm,adj,N;const H={sculpt:[],poly:[]};
let brush='push',sub=false,sym=true;
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,2600)}
function install(g){N=g.attributes.position.count;
  const ix=g.index.array,s=Array.from({length:N},()=>new Set());
  for(let i=0;i<ix.length;i+=3){const a=ix[i],b=ix[i+1],e=ix[i+2];s[a].add(b).add(e);s[b].add(a).add(e);s[e].add(a).add(b)}
  adj=s.map(x=>[...x]);
  if(mesh){scene.remove(mesh);geo.dispose()}
  geo=g;g.computeVertexNormals();g.computeBoundingSphere();
  pos=g.attributes.position.array;col=g.attributes.color.array;nrm=g.attributes.normal.array;
  mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,metalness:0,side:THREE.DoubleSide}));
  scene.add(mesh);H.sculpt=[];
}
function refresh(){geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;geo.computeVertexNormals();geo.attributes.normal.needsUpdate=true;geo.computeBoundingSphere()}
function region(p,R){const idx=[],w=[],R2=R*R;
  for(let i=0;i<N;i++){const dx=pos[3*i]-p.x,dy=pos[3*i+1]-p.y,dz=pos[3*i+2]-p.z,d=dx*dx+dy*dy+dz*dz;
    if(d<R2){const t=1-d/R2;idx.push(i);w.push(t*t)}}
  return{idx,w}}
function dab(p,R,k,s){
  const{idx,w}=region(p,R);if(!idx.length)return;
  let ax=0,ay=0,az=0;
  for(let j=0;j<idx.length;j++){const i=idx[j];ax+=nrm[3*i]*w[j];ay+=nrm[3*i+1]*w[j];az+=nrm[3*i+2]*w[j]}
  const l=Math.hypot(ax,ay,az)||1;ax/=l;ay/=l;az/=l;
  if(brush==='smooth'){const t=new Float32Array(idx.length*3);
    for(let j=0;j<idx.length;j++){const a=adj[idx[j]];let x=0,y=0,z=0;for(const n of a){x+=pos[3*n];y+=pos[3*n+1];z+=pos[3*n+2]}
      t[3*j]=x/a.length;t[3*j+1]=y/a.length;t[3*j+2]=z/a.length}
    for(let j=0;j<idx.length;j++){const i=idx[j],f=Math.min(1,w[j]*k*.8);
      pos[3*i]+=(t[3*j]-pos[3*i])*f;pos[3*i+1]+=(t[3*j+1]-pos[3*i+1])*f;pos[3*i+2]+=(t[3*j+2]-pos[3*i+2])*f}
  }else if(brush==='paint'){const c=new THREE.Color($('clr').value);
    for(let j=0;j<idx.length;j++){const i=idx[j],f=Math.min(1,w[j]*k*1.5);
      col[3*i]+=(c.r-col[3*i])*f;col[3*i+1]+=(c.g-col[3*i+1])*f;col[3*i+2]+=(c.b-col[3*i+2])*f}
  }else{const A=s*k*R*.08;
    for(let j=0;j<idx.length;j++){const i=idx[j],a=A*w[j];
      if(brush==='push'){pos[3*i]+=ax*a;pos[3*i+1]+=ay*a;pos[3*i+2]+=az*a}
      else if(brush==='inflate'){pos[3*i]+=nrm[3*i]*a;pos[3*i+1]+=nrm[3*i+1]*a;pos[3*i+2]+=nrm[3*i+2]*a}
      else if(brush==='pinch'){let dx=p.x-pos[3*i],dy=p.y-pos[3*i+1],dz=p.z-pos[3*i+2];const dn=dx*ax+dy*ay+dz*az;dx-=ax*dn;dy-=ay*dn;dz-=az*dn;
        const f=Math.min(.5,w[j]*k*.4)*s;pos[3*i]+=dx*f;pos[3*i+1]+=dy*f;pos[3*i+2]+=dz*f}}}
}
const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),pointers=new Set();
let S=null;
function setRay(e){const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pt,camera)}
const R=()=>.03+$('rad').value/100*.6,K=()=>$('str').value/100;
function apply(p){const r=R(),k=K(),s=sub?-1:1;dab(p,r,k,s);if(sym&&Math.abs(p.x)>.02)dab(new THREE.Vector3(-p.x,p.y,p.z),r,k,s)}
const TG=()=>mode==='poly'?{obj:fm,ctx:withPoly,sync:polyRebuild,snap:psnapFn}:{obj:mesh,ctx:f=>f(),sync:refresh,snap:()=>{const p=pos.slice(),c=col.slice();return()=>{pos.set(p);col.set(c);refresh()}}};
function strokeAt(e,first){
  const t=TG();setRay(e);const h=ray.intersectObject(t.obj)[0];
  if(brush==='grab'){
    if(first){if(!h)return false;
      const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(),h.point);
      const mk=p=>{let g;t.ctx(()=>{g=region(p,R());g.o=g.idx.map(i=>[pos[3*i],pos[3*i+1],pos[3*i+2]])});return g};
      S.G={pl,s:h.point.clone(),a:mk(h.point),b:sym&&Math.abs(h.point.x)>.02?mk(new THREE.Vector3(-h.point.x,h.point.y,h.point.z)):null};return true}
    const G=S&&S.G,q=new THREE.Vector3();if(!G||!ray.ray.intersectPlane(G.pl,q))return;const d=q.sub(G.s);
    t.ctx(()=>{for(const[g,sx]of[[G.a,1],[G.b,-1]]){if(!g)continue;g.idx.forEach((i,j)=>{pos[3*i]=g.o[j][0]+d.x*sx*g.w[j];pos[3*i+1]=g.o[j][1]+d.y*g.w[j];pos[3*i+2]=g.o[j][2]+d.z*g.w[j]})}});
    t.sync();return true}
  if(!h)return false;
  if(mode==='poly'&&brush==='paint')paintAt(h);
  else{if(mode==='poly'&&first)ptopo=pTopo();t.ctx(()=>apply(h.point));t.sync()}
  return true}
let shift=false;
function endS(){if(S&&S.prev)brush=S.prev;S=null}
function panBy(e){
  const dx=e.clientX-S.pan[0],dy=e.clientY-S.pan[1];S.pan=[e.clientX,e.clientY];
  const k=camera.position.distanceTo(controls.target)*2*Math.tan(camera.fov*Math.PI/360)/cv.clientHeight,m=camera.matrixWorld.elements;
  const o=new THREE.Vector3(-dx*m[0]+dy*m[4],-dx*m[1]+dy*m[5],-dx*m[2]+dy*m[6]).multiplyScalar(k);
  camera.position.add(o);controls.target.add(o);controls.update()}
cv.addEventListener('pointerdown',e=>{
  pointers.add(e.pointerId);
  if(pointers.size>1){endS();pd=null;controls.enabled=true;return}
  if(mode!=='sculpt'&&!pbrush)return;
  const snap=TG().snap();S={id:e.pointerId};
  if(shift){S.prev=brush;brush='smooth'}
  if(strokeAt(e,true)){const h=H[mode];h.push(snap);if(h.length>20)h.shift();controls.enabled=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else{endS();if(shift){S={id:e.pointerId,pan:[e.clientX,e.clientY]};controls.enabled=false}}});
cv.addEventListener('pointermove',e=>{if(S&&e.pointerId===S.id){if(S.pan)panBy(e);else strokeAt(e,false)}});
const end=e=>{pointers.delete(e.pointerId);if(S&&e.pointerId===S.id)endS();if(!pointers.size)controls.enabled=true};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
document.querySelectorAll('.brush').forEach(b=>b.onclick=()=>{document.querySelectorAll('.brush').forEach(x=>x.classList.remove('on'));b.classList.add('on');brush=b.dataset.b});
$('sub').onclick=e=>{sub=!sub;e.currentTarget.classList.toggle('on',sub)};
$('sym').onclick=e=>{sym=!sym;e.currentTarget.classList.toggle('on',sym)};
$('undo').onclick=()=>{const f=H[mode].pop();f?f():msg('Nada que deshacer')};
$('exp').onclick=()=>{
  new THREE.GLTFExporter().parse(mode==='poly'?polyExport():mesh,async buf=>{
    try{const d=window.claude&&await claude.use('downloads');
      if(!d)return msg('La descarga no está disponible aquí');
      await d.save({filename:'escultura.glb.txt',data:buf});
      msg('Guardado. Quita el ".txt" del nombre para tener el .glb')
    }catch(err){if(err&&err.code!=='declined')msg('No se pudo guardar')}
  },{binary:true});
};

const FOV=45,OFOV=6,T=controls.target,tn=f=>Math.tan(f*Math.PI/360);
let ortho=false,snapDir=null,anim=null;
const V=(x,y,z)=>new THREE.Vector3(x,y,z).normalize();
const VIEWS=[[V(0,0,1),'F','Frontal','#d9605f'],[V(0,0,-1),'T','Trasera','#d9605f'],[V(1,0,0),'D','Derecha','#6fae5f'],[V(-1,0,0),'Iz','Izquierda','#6fae5f'],[V(0,1,.0001),'S','Superior','#5f8fd9'],[V(0,-1,.0001),'Inf','Inferior','#5f8fd9']];
function setFov(f){const dir=camera.position.clone().sub(T),nd=dir.length()*tn(camera.fov)/tn(f);dir.normalize();camera.fov=f;camera.updateProjectionMatrix();camera.position.copy(T).addScaledVector(dir,nd);controls.update()}
function curDir(){return camera.position.clone().sub(T).normalize()}
function leaveOrtho(){if(!ortho)return;ortho=false;snapDir=null;setFov(FOV)}
function goView(d1){
  if(!ortho){setFov(OFOV);ortho=true}
  camera.up.set(0,1,0);const d0=curDir();
  anim={d0,q:new THREE.Quaternion().setFromUnitVectors(d0,d1),t0:performance.now()};snapDir=d1.clone();
}
controls.addEventListener('change',()=>{if(ortho&&!anim&&snapDir&&curDir().angleTo(snapDir)>.03)leaveOrtho()});
function stepAnim(){if(!anim)return;

const sb=$('shf');let sticky=false,hold=false,bt=null,bd=null;
const setShift=()=>{shift=sticky||hold;sb.classList.toggle('on',shift)};
sb.addEventListener('contextmenu',e=>e.preventDefault());
sb.addEventListener('pointerdown',e=>{e.preventDefault();try{sb.setPointerCapture(e.pointerId)}catch(_){}
  bd={x:e.clientX,y:e.clientY,ox:sb.offsetLeft,oy:sb.offsetTop,drag:false};bt=setTimeout(()=>{hold=true;setShift()},350)});
sb.addEventListener('pointermove',e=>{if(!bd)return;const dx=e.clientX-bd.x,dy=e.clientY-bd.y;
  if(!bd.drag&&Math.hypot(dx,dy)>10){bd.drag=true;clearTimeout(bt);hold=false;setShift()}
  if(bd.drag){const a=$('app');sb.style.right='auto';sb.style.left=Math.max(0,Math.min(a.clientWidth-56,bd.ox+dx))+'px';sb.style.top=Math.max(0,Math.min(a.clientHeight-56,bd.oy+dy))+'px'}});
const sbUp=()=>{if(!bd)return;clearTimeout(bt);if(!bd.drag&&!hold)sticky=!sticky;hold=false;bd=null;setShift()};
